<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TechHelper{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='styles.css') }}?v=20251216"
    />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body class="app-body text-slate-900">
    <header class="app-header">
      <nav class="app-container app-nav">
        <a class="app-brand" href="{{ url_for('read_root') }}">
          <span>TechHelper</span>
        </a>
        <ul class="app-nav-links">
          <li>
            <a
              class="app-nav-link {% if request.url.path.startswith('/calculators') %}is-active{% endif %}"
              href="{{ url_for('calculators_home') }}"
            >
              Kalkulatory
            </a>
          </li>
          <li>
            <a
              class="app-nav-link {% if request.url.path.startswith('/tools') %}is-active{% endif %}"
              href="{{ url_for('tools_home') }}"
            >
              Baza narzędzi
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="app-container app-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="app-footer">
      <div class="app-container">TechHelper</div>
    </footer>
  </body>
</html>
