{% extends "base.html" %} {% block title %}Wiertła | TechHelper{% endblock %} {%
block content %}
<section class="app-section">
  <header>
    <div class="flex justify-between items-center">
      <div>
        <span class="app-section-eyebrow">Wiertła</span>
        <h1 class="app-section-title">Katalog wierteł</h1>
        <p class="app-section-lede">
          Baza wierteł z parametrami posuwu fn i prędkości skrawania.
        </p>
      </div>
      <a
        href="{{ url_for('drills_add_form') }}"
        class="app-button app-button--primary"
      >
        + Dodaj wiertło
      </a>
    </div>
  </header>

  <!-- Search Box -->
  <div class="mb-6 max-w-2xl">
    <input
      type="text"
      name="search"
      placeholder="Szukaj po symbolu lub producencie..."
      hx-get="{{ url_for('drills_filter') }}"
      hx-trigger="keyup changed delay:500ms"
      hx-target="#drills-table"
      class="app-input w-full"
    />
  </div>

  <!-- Results Table -->
  <div id="drills-table">{% include "tools/partials/drills_table.html" %}</div>
</section>
{% endblock %}
